[project]
name = "agamim-catalog"
version = "0.1.0"
description = "Agamim open-data catalog: CKAN ingest to the bronze lake, and the read-only catalog API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "tenacity>=9,<10",
  "google-cloud-storage>=2.18,<4",
  "google-cloud-bigquery>=3.27,<4",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
]

[project.scripts]
catalog-ingest = "catalog.ingest.main:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6",
  "respx>=0.22",
  "ruff>=0.8",
  "mypy>=1.13",
  "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "PT018", "E501", "RUF001"]  # Hebrew test data and wide fixture rows
# Table names in SQL come from validated deployment settings (see _IDENT); request values are parameters.
"src/catalog/api/source.py" = ["S608"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["catalog"]

[[tool.mypy.overrides]]
module = ["google.cloud.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=catalog --cov-report=term-missing --cov-fail-under=80"
