[project]
name = "agamim-catalog"
version = "0.1.0"
description = "Agamim open-data catalog: the read-only catalog API over the gold schema in Azure SQL"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "gunicorn>=23,<28",
  "pydantic>=2.9,<3",
  "pyodbc>=5.2,<6",
  "azure-identity>=1.19,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
  "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "PT018", "E501", "RUF001"]  # Hebrew test data and wide fixture rows
# Table names in SQL come from validated deployment settings (see _IDENT); request values are parameters.
"src/catalog/api/source.py" = ["S608"]  # fixed SQL text only; values are ? parameters

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["catalog"]

[[tool.mypy.overrides]]
module = ["pyodbc"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=catalog --cov-report=term-missing --cov-fail-under=80"
